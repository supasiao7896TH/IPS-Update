<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Activity Tracker v2.0</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@1.28.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f0f2f5; }
        #main-header-title { font-family: 'Fraunces', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff; }
            .print-container { box-shadow: none !important; border: 1px solid #ddd; }
            @page { size: A4 landscape; margin: 20px; }
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="notification-container" class="fixed top-5 right-5 z-[100] w-full max-w-xs space-y-3" aria-live="polite" aria-atomic="false"></div>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="no-print mb-8 text-center">
            <h1 id="main-header-title" class="text-3xl md:text-4xl font-bold text-gray-700">Kaizen Activity Tracker</h1>
            <p class="text-gray-500 mt-1">เวอร์ชัน 2.0 - ขับเคลื่อนโดย Tailwind CSS</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column -->
            <div class="lg:col-span-1 space-y-8">

                <!-- Kaizen Submission Form -->
                <div class="bg-white p-6 rounded-2xl shadow-lg print-container">
                    <h2 class="text-xl font-bold text-blue-600 border-b-2 border-blue-200 pb-3 mb-6 flex items-center"><i data-lucide="circle-plus" class="mr-3" aria-hidden="true"></i>บันทึกกิจกรรม Kaizen</h2>
                    <form id="kaizen-form" class="space-y-4">
                        <div>
                            <label for="employee-select" class="block text-sm font-medium text-gray-700 mb-1">พนักงาน</label>
                            <select id="employee-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="year-select" class="block text-sm font-medium text-gray-700 mb-1">ปี</label>
                                <select id="year-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                            </div>
                            <div>
                                <label for="month-select" class="block text-sm font-medium text-gray-700 mb-1">เดือน</label>
                                <select id="month-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                            </div>
                        </div>
                        <div>
                            <label for="submission-count" class="block text-sm font-medium text-gray-700 mb-1">จำนวนกิจกรรมที่ส่ง</label>
                            <input type="number" id="submission-count" min="0" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="กรอกจำนวน">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105 flex items-center justify-center">
                            <i data-lucide="save" class="mr-2" aria-hidden="true"></i>บันทึกข้อมูล
                        </button>
                    </form>
                </div>

                <!-- Action Buttons -->
                <div class="bg-white p-6 rounded-2xl shadow-lg no-print">
                    <h2 class="text-xl font-bold text-gray-700 border-b-2 border-gray-200 pb-3 mb-6 flex items-center"><i data-lucide="settings" class="mr-3" aria-hidden="true"></i>เครื่องมือและตัวเลือก</h2>
                    <div class="space-y-3">
                        <button id="add-employee-btn" class="w-full flex items-center justify-center gap-2 bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600 transition-transform transform hover:scale-105"><i data-lucide="user-plus" aria-hidden="true"></i>เพิ่มพนักงานใหม่</button>
                        <button id="manage-sections-btn" class="w-full flex items-center justify-center gap-2 bg-purple-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-600 transition-transform transform hover:scale-105"><i data-lucide="building-2" aria-hidden="true"></i>จัดการแผนก</button>
                        <button id="print-btn" class="w-full flex items-center justify-center gap-2 bg-gray-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-600 transition-transform transform hover:scale-105"><i data-lucide="printer" aria-hidden="true"></i>พิมพ์รายงาน</button>
                        <div class="grid grid-cols-2 gap-3 pt-4 border-t">
                            <button id="export-json-btn" class="w-full flex items-center justify-center gap-2 bg-indigo-500 text-white font-bold py-2 px-3 rounded-lg hover:bg-indigo-600 transition text-sm"><i data-lucide="file-output" aria-hidden="true"></i>ส่งออก JSON</button>
                            <button id="import-btn" class="w-full flex items-center justify-center gap-2 bg-yellow-500 text-white font-bold py-2 px-3 rounded-lg hover:bg-yellow-600 transition text-sm"><i data-lucide="file-input" aria-hidden="true"></i>นำเข้า JSON</button>
                        </div>
                        <button id="export-html-btn" class="w-full flex items-center justify-center gap-2 bg-blue-800 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-900 transition-transform transform hover:scale-105"><i data-lucide="file-code" aria-hidden="true"></i>ส่งออกเป็นไฟล์เดียว (.html)</button>

                        <!-- AI & Email Tools -->
                        <div class="pt-4 border-t space-y-3">
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">เครื่องมือ AI</p>
                            <button id="ocr-import-btn" class="w-full flex items-center justify-center gap-2 bg-teal-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-600 transition-transform transform hover:scale-105"><i data-lucide="camera" aria-hidden="true"></i>อ่านข้อมูลจากภาพ (AI)</button>
                            <button id="notes-csv-import-btn" class="w-full flex items-center justify-center gap-2 bg-cyan-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-cyan-700 transition-transform transform hover:scale-105"><i data-lucide="file-spreadsheet" aria-hidden="true"></i>นำเข้าจาก Lotus Notes (CSV)</button>
                            <button id="generate-email-btn" class="w-full flex items-center justify-center gap-2 bg-orange-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-orange-600 transition-transform transform hover:scale-105"><i data-lucide="mail" aria-hidden="true"></i>สร้างสรุปอีเมล</button>
                            <button id="export-report-btn" class="w-full flex items-center justify-center gap-2 bg-rose-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-rose-700 transition-transform transform hover:scale-105"><i data-lucide="file-text" aria-hidden="true"></i>ส่งออกรายงาน PDF</button>
                            <button id="export-email-banner-btn" class="w-full flex items-center justify-center gap-2 bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-700 transition-transform transform hover:scale-105"><i data-lucide="images" aria-hidden="true"></i>ส่งออก Email Banner</button>
                        </div>
                    </div>
                    <input type="file" id="import-file-input" accept=".json" class="hidden" aria-label="นำเข้าไฟล์ JSON">
                </div>
            </div>

            <!-- Right Column -->
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-6 rounded-2xl shadow-lg print-container">
                     <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
                        <h2 class="text-xl font-bold text-gray-700 flex items-center"><i data-lucide="chart-line" class="mr-3" aria-hidden="true"></i>แผงควบคุม (Dashboard)</h2>
                        <div class="flex items-center gap-2">
                             <label for="filter-year-chart" class="text-sm font-medium text-gray-700 whitespace-nowrap">ปีที่แสดง (กราฟ + รายงาน):</label>
                             <select id="filter-year-chart" class="p-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                        </div>
                    </div>
                    <div class="h-64 md:h-80"><canvas id="kaizen-chart" aria-label="กราฟแสดงยอดรวม Kaizen รายเดือน" role="img"></canvas></div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-lg print-container">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 no-print">
                        <h2 class="text-xl font-bold text-gray-700 flex items-center"><i data-lucide="table" class="mr-3" aria-hidden="true"></i>รายงานสรุป</h2>
                        <div class="flex items-center gap-4 flex-wrap">
                            <div class="flex items-center gap-2">
                                <i data-lucide="target" class="text-red-500" style="width:0.875rem;height:0.875rem;" aria-hidden="true"></i>
                                <label for="global-target" class="text-sm font-medium text-gray-700 whitespace-nowrap">เป้าหมาย:</label>
                                <input type="number" id="global-target" min="1" max="999" class="w-16 p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold focus:ring-2 focus:ring-red-400 focus:border-red-400 transition">
                                <span class="text-xs text-gray-500 whitespace-nowrap">เรื่อง/คน/ปี</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <label for="filter-section" class="text-sm font-medium text-gray-700 whitespace-nowrap">แผนก:</label>
                                <select id="filter-section" class="p-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                            </div>
                        </div>
                    </div>
                    <div id="top-performers-section" class="mb-6"></div>
                    <div class="overflow-x-auto">
                        <table id="report-table" class="w-full text-sm text-left text-gray-500">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100"></thead>
                            <tbody class="bg-white"></tbody>
                            <tfoot class="font-bold text-gray-800 bg-gray-100"></tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-container"></div>
    <script id="data-injector" type="application/json"></script>

    <script type="module" src="/src/main.js"></script>
</body>
