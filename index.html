<!DOCTYPE html>
<html lang="th">

    <title>Kaizen Activity Tracker v2.0</title>

        ::-webkit-scrollbar-track { background: #f1f1f1; }

<body class="text-gray-800">

    <div id="notification-container" class="fixed top-5 right-5 z-[100] w-full max-w-xs space-y-3" aria-live="polite" aria-atomic="false"></div>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="no-print mb-8 text-center">
            <h1 id="main-header-title" class="text-3xl md:text-4xl font-bold text-gray-700">Kaizen Activity Tracker</h1>
            <p class="text-gray-500 mt-1">เวอร์ชัน 2.0 - ขับเคลื่อนโดย Tailwind CSS</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column -->
            <div class="lg:col-span-1 space-y-8">

                <!-- Kaizen Submission Form -->
                <div class="bg-white p-6 rounded-2xl shadow-lg print-container">
                    <h2 class="text-xl font-bold text-blue-600 border-b-2 border-blue-200 pb-3 mb-6 flex items-center"><i data-lucide="circle-plus" class="mr-3" aria-hidden="true"></i>บันทึกกิจกรรม Kaizen</h2>
                    <form id="kaizen-form" class="space-y-4">
                        <div>
                            <label for="employee-select" class="block text-sm font-medium text-gray-700 mb-1">พนักงาน</label>
                            <select id="employee-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="year-select" class="block text-sm font-medium text-gray-700 mb-1">ปี</label>
                                <select id="year-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                            </div>
                            <div>
                                <label for="month-select" class="block text-sm font-medium text-gray-700 mb-1">เดือน</label>
                                <select id="month-select" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></select>
                            </div>
                        </div>
                        <div>
                            <label for="submission-count" class="block text-sm font-medium text-gray-700 mb-1">จำนวนกิจกรรมที่ส่ง</label>
                            <input type="number" id="submission-count" min="0" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="กรอกจำนวน">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105 flex items-center justify-center">
                            <i data-lucide="save" class="mr-2" aria-hidden="true"></i>บันทึกข้อมูล
                        </button>
                    </form>
                </div>

                <!-- Action Buttons -->
                <div class="bg-white p-6 rounded-2xl shadow-lg no-print">
                    <h2 class="text-xl font-bold text-gray-700 border-b-2 border-gray-200 pb-3 mb-6 flex items-center"><i data-lucide="settings" class="mr-3" aria-hidden="true"></i>เครื่องมือและตัวเลือก</h2>
                    <div class="space-y-3">
                        <button id="add-employee-btn" class="w-full flex items-center justify-center gap-2 bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600 transition-transform transform hover:scale-105"><i data-lucide="user-plus" aria-hidden="true"></i>เพิ่มพนักงานใหม่</button>
                        <button id="manage-sections-btn" class="w-full flex items-center justify-center gap-2 bg-purple-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-600 transition-transform transform hover:scale-105"><i data-lucide="building-2" aria-hidden="true"></i>จัดการแผนก</button>
                        <button id="print-btn" class="w-full flex items-center justify-center gap-2 bg-gray-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-600 transition-transform transform hover:scale-105"><i data-lucide="printer" aria-hidden="true"></i>พิมพ์รายงาน</button>
                        <div class="grid grid-cols-2 gap-3 pt-4 border-t">
                            <button id="export-json-btn" class="w-full flex items-center justify-center gap-2 bg-indigo-500 text-white font-bold py-2 px-3 rounded-lg hover:bg-indigo-600 transition text-sm"><i data-lucide="file-output" aria-hidden="true"></i>ส่งออก JSON</button>

                            <button id="ocr-import-btn" class="w-full flex items-center justify-center gap-2 bg-teal-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-600 transition-transform transform hover:scale-105"><i data-lucide="camera" aria-hidden="true"></i>อ่านข้อมูลจากภาพ (AI)</button>

                            <button id="export-email-banner-btn" class="w-full flex items-center justify-center gap-2 bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-700 transition-transform transform hover:scale-105"><i data-lucide="images" aria-hidden="true"></i>ส่งออก Email Banner</button>

                    </div>
                    <input type="file" id="import-file-input" accept=".json" class="hidden" aria-label="นำเข้าไฟล์ JSON">

            </div>

                            <tbody class="bg-white"></tbody>
                            <tfoot class="font-bold text-gray-800 bg-gray-100"></tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        // ─── STATE_STORE — reactive pub/sub + optimistic update/rollback ────
        const STATE_STORE = (() => {
            'use strict';
            const _state = {
                sections: [], employees: [], activities: [],
                currentYear: new Date().getFullYear(), currentMonth: new Date().getMonth() + 1,
                filterYear: new Date().getFullYear(), filterSection: 'all',
                globalTarget: 12,
                geminiKeyConfigured: false,
                cloudSyncStatus: 'offline',
            };
            const _subs = new Map();

            function get(key) { return key === undefined ? _state : _state[key]; }

            function set(key, value, opts) {
                opts = opts || {};
                const prev = _state[key];
                _state[key] = value;
                if (!opts.silent) _emit(key, value, prev);
            }

            function _emit(key, value, prev) {
                const s = _subs.get(key);
                if (!s) return;
                s.forEach(fn => {
                    try { fn(value, prev); } catch (err) { DEBUG_MODULE.log('error', `STATE_STORE.subscriber:${key}`, err); }
                });
            }

            function on(key, fn) {
                if (!_subs.has(key)) _subs.set(key, new Set());
                _subs.get(key).add(fn);
                return () => off(key, fn);
            }
            function off(key, fn) {
                const s = _subs.get(key);
                if (s) s.delete(fn);
            }

            async function optimisticUpdate(key, nextValue, persistFn) {
                const prev = get(key);
                set(key, nextValue);
                try {
                    await persistFn(nextValue);
                    CLOUD_SYNC_MANAGER.pushChange(key, nextValue);
                } catch (err) {
                    set(key, prev);
                    UI_RENDERER.showNotification('บันทึกไม่สำเร็จ กู้คืนข้อมูลเดิมแล้ว', 'error');
                    DEBUG_MODULE.log('error', `optimisticUpdate:${key}`, err);
                    throw err;
                }
            }

            return { get, set, on, off, optimisticUpdate };
        })();

        // ─── STORAGE_ENGINE — IndexedDB (Promise-based) + one-time migration ─
        const STORAGE_ENGINE = (() => {
            'use strict';
            let _db = null;

            function _hasIndexedDB() { return 'indexedDB' in window; }

            function _openDb() {
                return new Promise((resolve, reject) => {
                    if (!_hasIndexedDB()) { reject(new Error('IndexedDB unavailable')); return; }
                    const req = indexedDB.open(APP_CONFIG.DB_NAME, APP_CONFIG.DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (e.oldVersion < 1) {
                            db.createObjectStore('sections', { keyPath: 'id' });
                            const emp = db.createObjectStore('employees', { keyPath: 'id' });
                            emp.createIndex('by_sectionId', 'sectionId');
                            const act = db.createObjectStore('activities', { keyPath: 'id', autoIncrement: true });
                            act.createIndex('by_emp_year_month', ['employeeId', 'year', 'month'], { unique: true });
                            act.createIndex('by_employeeId', 'employeeId');
                            act.createIndex('by_year', 'year');
                            db.createObjectStore('settings', { keyPath: 'key' });
                            db.createObjectStore('cryptoKeys', { keyPath: 'name' });
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function _getDb() {
                if (!_db) _db = await _openDb();
                return _db;
            }

            async function _tx(storeNames, mode) {
                const db = await _getDb();
                return db.transaction(storeNames, mode);
            }

            async function getAll(storeName) {
                const tx = await _tx(storeName, 'readonly');
                return new Promise((resolve, reject) => {
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function get(storeName, key) {
                const tx = await _tx(storeName, 'readonly');
                return new Promise((resolve, reject) => {
                    const req = tx.objectStore(storeName).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function put(storeName, value) {
                const tx = await _tx(storeName, 'readwrite');
                return new Promise((resolve, reject) => {
                    const req = tx.objectStore(storeName).put(value);
                    req.onsuccess = () => { CLOUD_SYNC_MANAGER.pushChange(storeName, value); resolve(req.result); };
                    req.onerror = () => reject(req.error);
                });
            }

            // Clear-then-bulk-put a whole store inside one transaction (used for import / full-collection save)
            async function replaceAll(storeName, rows) {
                const db = await _getDb();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.clear();
                    rows.forEach(r => store.put(r));
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function _seedIfEmpty() {
                const existingSections = await getAll('sections');
                if (existingSections.length > 0) return;
                const d = APP_CONFIG.DEFAULT_DATA;
                await replaceAll('sections', JSON.parse(JSON.stringify(d.sections)));
                await replaceAll('employees', JSON.parse(JSON.stringify(d.employees)));
                await replaceAll('activities', JSON.parse(JSON.stringify(d.activities)).map((a, i) => ({ id: i + 1, ...a })));
            }

            async function migrateFromLocalStorage() {
                try {
                    const db = await _getDb();
                    const already = await get('settings', 'migration_localStorage_v1');
                    if (already && already.value) return;

                    if (!HAS_STORAGE) {
                        await _seedIfEmpty();
                        await put('settings', { key: 'migration_localStorage_v1', value: true });
                        return;
                    }

                    const sRaw = localStorage.getItem(APP_CONFIG.storageKeys.sections);
                    const eRaw = localStorage.getItem(APP_CONFIG.storageKeys.employees);
                    const aRaw = localStorage.getItem(APP_CONFIG.storageKeys.activities);

                    if (sRaw && eRaw && aRaw) {
                        const sections   = JSON.parse(sRaw);
                        const employees  = JSON.parse(eRaw);
                        const activities = JSON.parse(aRaw).map((a, i) => ({ id: i + 1, ...a }));

                        await new Promise((resolve, reject) => {
                            const tx = db.transaction(['sections', 'employees', 'activities', 'settings'], 'readwrite');
                            sections.forEach(s => tx.objectStore('sections').put(s));
                            employees.forEach(e => tx.objectStore('employees').put(e));
                            activities.forEach(a => tx.objectStore('activities').put(a));
                            const gt = localStorage.getItem('kaizen_global_target');
                            if (gt) tx.objectStore('settings').put({ key: 'globalTarget', value: parseInt(gt, 10) || 12 });
                            const author = localStorage.getItem('kaizen_report_author');
                            if (author) tx.objectStore('settings').put({ key: 'reportAuthor', value: author });
                            tx.oncomplete = resolve;
                            tx.onerror = () => reject(tx.error);
                        });

                        const rawKey = localStorage.getItem('kaizen_gemini_key');
                        if (rawKey) { await GEMINI_AI_BRIDGE.encryptAndStoreApiKey(rawKey); }

                        localStorage.removeItem(APP_CONFIG.storageKeys.sections);
                        localStorage.removeItem(APP_CONFIG.storageKeys.employees);
                        localStorage.removeItem(APP_CONFIG.storageKeys.activities);
                        localStorage.removeItem('kaizen_global_target');
                        localStorage.removeItem('kaizen_gemini_key');
                        localStorage.removeItem('kaizen_report_author');
                    } else {
                        await _seedIfEmpty();
                    }

                    await put('settings', { key: 'migration_localStorage_v1', value: true });
                } catch (err) {
                    DEBUG_MODULE.log('error', 'STORAGE_ENGINE.migrateFromLocalStorage', err);
                    UI_RENDERER.showNotification('การย้ายข้อมูลไม่สำเร็จ — ข้อมูลเดิมยังปลอดภัยอยู่ (ไม่ถูกลบ)', 'error');
                }
            }

            async function loadAll() {
                const [sections, employees, activities, gtRec] = await Promise.all([
                    getAll('sections'), getAll('employees'), getAll('activities'), get('settings', 'globalTarget'),
                ]);
                return { sections, employees, activities, globalTarget: gtRec ? gtRec.value : 12 };
            }

            async function saveSections(sections)   { await replaceAll('sections', sections); }
            async function saveEmployees(employees) { await replaceAll('employees', employees); }
            async function saveActivities(activities) { await replaceAll('activities', activities); }
            async function saveGlobalTarget(value)  { await put('settings', { key: 'globalTarget', value }); }
            async function saveReportAuthor(value)  { await put('settings', { key: 'reportAuthor', value }); }

            function _stripActivityIds(activities) {
                return activities.map(a => { const { id, ...rest } = a; return rest; });
            }

            function exportJson(sections, employees, activities) {
                const str  = JSON.stringify({ sections, employees, activities: _stripActivityIds(activities) }, null, 2);
                const blob = new Blob([str], { type: 'application/json' });
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href = url; a.download = `kaizen_data_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            }

            function serializeForExport(sections, employees, activities) {
                return JSON.stringify({ sections, employees, activities: _stripActivityIds(activities) })
                    .replace(/<\/script>/gi, '<\\/script>');
            }

            function parseImportFile(file) {
                return new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = (e) => {
                        try {
                            const d = JSON.parse(e.target.result);
                            if (!Array.isArray(d.sections) || !Array.isArray(d.employees) || !Array.isArray(d.activities)) {
                                reject(new Error('invalid-shape')); return;
                            }
                            const toInt = (v, dflt) => { dflt = dflt || 0; const n = parseInt(v, 10); return Number.isNaN(n) ? dflt : n; };
                            const sections   = d.sections.map(s => ({ ...s, id: toInt(s.id) }));
                            const employees  = d.employees.map(emp => ({ ...emp, id: toInt(emp.id),
                                sectionId: emp.sectionId == null ? null : toInt(emp.sectionId), annualTarget: toInt(emp.annualTarget) }));
                            const activities = d.activities.map((a, i) => ({ id: i + 1, ...a, employeeId: toInt(a.employeeId),
                                year: toInt(a.year), month: toInt(a.month), count: toInt(a.count) }));
                            resolve({ sections, employees, activities });
                        } catch (err) { reject(err); }
                    };
                    r.onerror = () => reject(new Error('read-error'));
                    r.readAsText(file);
                });
            }

            return {
                migrateFromLocalStorage, loadAll,
                saveSections, saveEmployees, saveActivities, saveGlobalTarget, saveReportAuthor,
                exportJson, serializeForExport, parseImportFile, get, put,
            };
        })();

        // ─── GEMINI_AI_BRIDGE — Vision OCR + fuzzy matching + AES-GCM key vault
        const GEMINI_AI_BRIDGE = (() => {
            'use strict';

            async function _getOrCreateWrapKey() {
                const rec = await STORAGE_ENGINE.get('cryptoKeys', 'geminiKeyWrap');
                if (rec && rec.key) return rec.key;
                const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
                await STORAGE_ENGINE.put('cryptoKeys', { name: 'geminiKeyWrap', key });
                return key;
            }

            async function encryptAndStoreApiKey(plaintext) {
                const key = await _getOrCreateWrapKey();
                const iv  = crypto.getRandomValues(new Uint8Array(12));
                const buf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
                await STORAGE_ENGINE.put('settings', {
                    key: 'geminiApiKeyEnc',
                    value: { iv: Array.from(iv), ciphertext: Array.from(new Uint8Array(buf)) },
                });
                STATE_STORE.set('geminiKeyConfigured', true);
            }

            async function decryptApiKey() {
                const rec = await STORAGE_ENGINE.get('settings', 'geminiApiKeyEnc');
                if (!rec) return null;
                const key  = await _getOrCreateWrapKey();
                const iv   = new Uint8Array(rec.value.iv);
                const data = new Uint8Array(rec.value.ciphertext);
                const buf  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                return new TextDecoder().decode(buf);
            }

            async function analyzeImageWithGemini(apiKey, base64Image, mimeType) {
                const prompt = `Analyze this screenshot of a report/database table.
Extract ALL employee names and their Count values.
The Count column is typically the rightmost numeric column.
Each employee appears as a grouped row with their full name and a number.

Return ONLY a valid JSON array (no markdown, no explanation):
[{"name": "Full Name", "count": 5}]`;

                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${APP_CONFIG.GEMINI_MODEL}:generateContent`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                        body: JSON.stringify({
                            contents: [{ parts: [
                                { text: prompt },
                                { inline_data: { mime_type: mimeType, data: base64Image } }
                            ]}],
                            generationConfig: { temperature: 0 }
                        })
                    }
                );
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    const e = new Error((err.error && err.error.message) || `HTTP ${res.status}`);
                    DEBUG_MODULE.log('error', 'GEMINI_AI_BRIDGE.analyzeImageWithGemini', e);
                    throw e;
                }
                const result = await res.json();
                const text   = (result.candidates && result.candidates[0] && result.candidates[0].content
                    && result.candidates[0].content.parts && result.candidates[0].content.parts[0]
                    && result.candidates[0].content.parts[0].text) || '';
                const clean  = text.replace(/```json|```/gi, '').trim();
                const m      = clean.match(/\[[\s\S]*\]/);
                if (!m) {
                    const e = new Error('ไม่สามารถอ่านตารางจากภาพได้ — ลองใช้ภาพที่ชัดขึ้น');
                    DEBUG_MODULE.log('error', 'GEMINI_AI_BRIDGE.analyzeImageWithGemini', e);
                    throw e;
                }
                return JSON.parse(m[0]);
            }

            function matchEmployeeByName(name) {
                const employees = STATE_STORE.get('employees');
                const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ').trim();
                const tgt  = norm(name);

                let found = employees.find(e => norm(`${e.firstName} ${e.lastName}`) === tgt);
                if (found) return found;
                const first = tgt.split(' ')[0];
                found = employees.find(e => norm(e.firstName) === first);
                if (found) return found;
                found = employees.find(e => {
                    const full = norm(`${e.firstName} ${e.lastName}`);
                    return full.includes(tgt) || tgt.includes(norm(e.firstName));
                });
                if (found) return found;

                const lev = (a, b) => {
                    if (a.length === 0) return b.length;
                    if (b.length === 0) return a.length;
                    const matrix = [];
                    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
                    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
                    for (let i = 1; i <= b.length; i++) {
                        for (let j = 1; j <= a.length; j++) {
                            if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
                            else matrix[i][j] = Math.min(matrix[i-1][j-1]+1, Math.min(matrix[i][j-1]+1, matrix[i-1][j]+1));
                        }
                    }
                    return matrix[b.length][a.length];
                };

                let bestMatch = null, bestScore = Infinity;
                employees.forEach(e => {
                    const sysFirst = norm(e.firstName), sysLast = norm(e.lastName);
                    const sysFull  = `${sysFirst} ${sysLast}`;
                    const dFull = lev(tgt, sysFull);
                    const tgtParts = tgt.split(' ');
                    const tgtFirst = tgtParts[0] || '';
                    const tgtLast  = tgtParts.slice(1).join(' ') || '';
                    const dFirst = lev(tgtFirst, sysFirst);
                    const dLast  = lev(tgtLast, sysLast);
                    const score = Math.min(dFull, dFirst + dLast);
                    const firstMatchBonus = (dFirst <= 2 && sysLast.charAt(0) === tgtLast.charAt(0)) ? -2 : 0;
                    const finalScore = score + firstMatchBonus;
                    if (finalScore < bestScore) { bestScore = finalScore; bestMatch = e; }
                });

                const maxDist = Math.max(5, Math.floor(tgt.length * 0.4));
                if (bestMatch && bestScore <= maxDist) return bestMatch;
                return null;
            }

            return { encryptAndStoreApiKey, decryptApiKey, analyzeImageWithGemini, matchEmployeeByName };
        })();

                employeeSelect.appendChild(blank);
                [...employees]

            function renderReportTable() {
                const { reportTable } = _dom;
                const filterYear    = STATE_STORE.get('filterYear');
                const filterSection = STATE_STORE.get('filterSection');
                const sections      = STATE_STORE.get('sections');
                const employees     = STATE_STORE.get('employees');
                const activities    = STATE_STORE.get('activities');
                const monthNames    = APP_CONFIG.monthNames;

                _dom.mainHeader.textContent = `Kaizen Activity Tracker - ปี ${filterYear}`;

                const filtered = employees.filter(emp =>
                    filterSection === 'all' || emp.sectionId === parseInt(filterSection, 10)
                );
                const scores = filtered.map(emp => {
                    const acts = activities.filter(a => a.employeeId === emp.id && a.year === filterYear);
                    return { emp, totalSum: acts.reduce((s,a) => s+a.count, 0) };
                }).sort((a,b) => b.totalSum - a.totalSum);

                renderTopPerformers(scores);

                const thead = reportTable.querySelector('thead');
                const tbody = reportTable.querySelector('tbody');
                const tfoot = reportTable.querySelector('tfoot');

                thead.innerHTML = `<tr>
                    <th scope="col" class="px-4 py-3">ชื่อ-สกุล</th>
                    <th scope="col" class="px-2 py-3 text-center">แผนก</th>
                    <th scope="col" class="px-2 py-3 text-center bg-blue-100">รวม</th>
                    <th scope="col" class="px-2 py-3 text-center">ความคืบหน้า</th>
                    ${monthNames.map(m=>`<th scope="col" class="px-2 py-3 text-center w-8">${escHtml(m)}</th>`).join('')}
                    <th scope="col" class="px-4 py-3 text-center no-print">จัดการ</th>
                </tr>`;

                if (scores.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="17" class="text-center py-10 text-gray-500">ไม่พบข้อมูลพนักงาน</td></tr>`;
                    tfoot.innerHTML = '';
                    if (window.lucide) lucide.createIcons();
                    return;
                }

                let grand = 0;
                const mTotals = Array(12).fill(0);
                const top = scores[0].totalSum;
                const gTgt = STATE_STORE.get('globalTarget') || 12;

                tbody.innerHTML = scores.map(({emp, totalSum}) => {
                    const sec  = sections.find(s => s.id === emp.sectionId);
                    const acts = activities.filter(a => a.employeeId === emp.id && a.year === filterYear);
                    const mc   = Array(12).fill(0);
                    acts.forEach(a => { if(a.month>=1&&a.month<=12) mc[a.month-1]+=a.count; });
                    mc.forEach((c,i) => mTotals[i]+=c);
                    grand += totalSum;
                    const pct = gTgt>0 ? (totalSum/gTgt)*100 : 0;
                    const ok  = totalSum >= gTgt;
                    const isTp = totalSum>0 && totalSum===top;
                    return `<tr class="border-b hover:bg-gray-50 ${isTp?'bg-yellow-50':''}" data-employee-id="${emp.id}">
                        <th scope="row" class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap">${escHtml(emp.firstName)} ${escHtml(emp.lastName)}</th>
                        <td class="px-2 py-3 text-center">${sec?escHtml(sec.name):'-'}</td>
                        <td class="px-2 py-3 text-center font-bold text-blue-600 bg-blue-50">${totalSum}</td>
                        <td class="px-2 py-3 text-center">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${ok?'bg-green-100 text-green-800':'bg-gray-100 text-gray-800'}">
                                ${ok?'<i data-lucide="circle-check" class="text-green-500 inline-block align-text-bottom" style="width:14px;height:14px;" aria-hidden="true"></i>':''} ${pct.toFixed(0)}%
                            </span>
                        </td>
                        ${mc.map(c=>`<td class="px-2 py-3 text-center ${c===0?'text-gray-400':'font-medium'}">${c}</td>`).join('')}
                        <td class="px-4 py-3 text-center no-print">
                            <button class="text-blue-600 hover:text-blue-800 inline-edit-btn" aria-label="แก้ไข ${escHtml(emp.firstName)}"><i data-lucide="pencil" aria-hidden="true"></i></button>
                            <button class="text-red-600 hover:text-red-800 ml-2 inline-delete-btn" aria-label="ลบ ${escHtml(emp.firstName)}"><i data-lucide="trash-2" aria-hidden="true"></i></button>
                        </td>
                    </tr>`;
                }).join('');

                tfoot.innerHTML = `<tr>
                    <td class="px-4 py-3 font-bold" colspan="2">รวมทั้งสิ้น</td>
                    <td class="px-2 py-3 text-center text-blue-700 bg-blue-100">${grand}</td>
                    <td class="px-2 py-3"></td>
                    ${mTotals.map(t=>`<td class="px-2 py-3 text-center">${t}</td>`).join('')}
                    <td class="px-4 py-3 no-print"></td>
                </tr>`;

                if (window.lucide) lucide.createIcons();
            }

            function renderTopPerformers(scores) {
                const { topPerformersSection } = _dom;
                topPerformersSection.innerHTML = '';
                if (!scores.length) return;
                const uniq = [...new Set(scores.map(e=>e.totalSum))].sort((a,b)=>b-a).filter(s=>s>0).slice(0,3);
                if (!uniq.length) return;
                const medals = [{icon:'trophy',color:'text-yellow-400'},{icon:'medal',color:'text-gray-400'},{icon:'award',color:'text-yellow-600'}];
                topPerformersSection.innerHTML = `
                    <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center"><i data-lucide="crown" class="mr-3 text-yellow-500" aria-hidden="true"></i>ผู้มีผลงานสูงสุด</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${uniq.map((score,idx) => {
                            const winners = scores.filter(e=>e.totalSum===score);
                            const m = medals[idx];
                            return `<div class="bg-gradient-to-br from-gray-50 to-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                <div class="flex items-center justify-between">
                                    <p class="font-bold text-gray-600">อันดับที่ ${idx+1}</p>
                                    <i data-lucide="${m.icon}" class="${m.color}" style="width:1.5rem;height:1.5rem;" aria-hidden="true"></i>
                                </div>
                                <p class="text-2xl font-bold text-gray-800 my-2">${score} <span class="text-sm font-normal">เรื่อง</span></p>
                                <div class="text-sm text-gray-600 space-y-1">
                                    ${winners.map(w=>`<div><i data-lucide="user-check" class="text-green-500 mr-2 inline-block" style="width:1rem;height:1rem;" aria-hidden="true"></i>${escHtml(w.emp.firstName)}</div>`).join('')}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`;
                if (window.lucide) lucide.createIcons();
            }

            function renderDashboardChart() {
                if (typeof Chart === 'undefined') { DEBUG_MODULE.log('info', 'RENDER', 'Chart.js unavailable — dashboard chart skipped'); return; }
                const { chartCanvas } = _dom;
                const filterYear = STATE_STORE.get('filterYear');
                const activities = STATE_STORE.get('activities');
                const mt = Array(12).fill(0);
                activities.filter(a=>a.year===filterYear).forEach(a=>{ if(a.month>=1&&a.month<=12) mt[a.month-1]+=a.count; });
                const chartData = {
                    labels: APP_CONFIG.monthNames,
                    datasets: [{ label:`ยอดรวม Kaizen ปี ${filterYear}`, data:mt,
                        backgroundColor:'rgba(59,130,246,0.5)', borderColor:'rgba(59,130,246,1)',
                        borderWidth:2, borderRadius:5, hoverBackgroundColor:'rgba(59,130,246,0.8)' }]
                };
                if (_chartInstance) { _chartInstance.data=chartData; _chartInstance.update(); }
                else {
                    _chartInstance = new Chart(chartCanvas.getContext('2d'), {
                        type:'bar', data:chartData,
                        options:{ responsive:true, maintainAspectRatio:false,
                            plugins:{legend:{display:false}},
                            scales:{ y:{beginAtZero:true,grid:{color:'#e5e7eb'}}, x:{grid:{display:false}} } }
                    });
                }
            }

            function showNotification(message, type) {
                type = type || 'info';
                const icons  = {success:'circle-check',error:'circle-x',info:'info'};
                const colors = {success:'bg-green-500',error:'bg-red-500',info:'bg-blue-500'};
                const n = document.createElement('div');
                n.className = `flex items-center p-4 rounded-lg shadow-lg text-white ${colors[type]} transform translate-x-full opacity-0 transition-all duration-500`;
                n.setAttribute('role','status');
                n.innerHTML = `<i data-lucide="${icons[type]}" class="mr-3" style="width:1.25rem;height:1.25rem;" aria-hidden="true"></i><span>${escHtml(message)}</span>`;
                _dom.notificationContainer.appendChild(n);
                if (window.lucide) lucide.createIcons();
                setTimeout(()=>n.classList.remove('translate-x-full','opacity-0'),10);
                setTimeout(()=>{ n.classList.add('translate-x-full','opacity-0'); n.addEventListener('transitionend',()=>n.remove(),{once:true}); },4000);
            }

            function showModal(opts, trigger) {
                const { title, body, actions } = opts;
                const maxWidth = opts.maxWidth || 'max-w-md';
                trigger = trigger || null;
                const id = `modal-${Date.now()}`;
                const tid = `${id}-title`;
                const _tmp = document.createElement('div');
                _tmp.innerHTML = `
                    <div id="${id}" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 p-4 transition-opacity duration-300 opacity-0"
                         role="dialog" aria-modal="true" aria-labelledby="${tid}">
                        <div class="bg-white rounded-2xl shadow-xl w-full ${maxWidth} transform scale-95 transition-transform duration-300">
                            <div class="flex justify-between items-center p-5 border-b border-gray-200">
                                <h3 id="${tid}" class="text-xl font-bold text-gray-800">${title}</h3>
                                <button class="text-gray-400 hover:text-gray-600 modal-close-btn text-2xl leading-none" aria-label="ปิด">&times;</button>
                            </div>
                            <div class="p-6">${body}</div>
                            <div class="flex justify-end gap-3 p-5 bg-gray-50 rounded-b-2xl">
                                ${actions.map(a=>`<button class="${a.classes} font-bold py-2 px-5 rounded-lg transition-transform transform hover:scale-105" data-action="${escHtml(a.id)}">${a.icon?`<i data-lucide="${escHtml(a.icon)}" class="mr-1.5 inline-block" style="width:1rem;height:1rem;vertical-align:-2px;" aria-hidden="true"></i>`:''}${escHtml(a.text)}</button>`).join('')}
                            </div>
                        </div>
                    </div>`;
                _dom.modalContainer.appendChild(_tmp.firstElementChild);
                const el = document.getElementById(id);
                if (window.lucide) lucide.createIcons();
                setTimeout(()=>{ el.classList.remove('opacity-0'); el.querySelector('.transform').classList.remove('scale-95'); },10);
                setTimeout(()=>{ const f=el.querySelector('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'); if(f) f.focus(); },50);
                const trap = (e) => {
                    if (e.key==='Escape') { closeModal(trigger); return; }
                    if (e.key!=='Tab') return;
                    const fs = Array.from(el.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
                    if (!fs.length) { e.preventDefault(); return; }
                    if (e.shiftKey) { if(document.activeElement===fs[0]){e.preventDefault();fs[fs.length-1].focus();} }
                    else            { if(document.activeElement===fs[fs.length-1]){e.preventDefault();fs[0].focus();} }
                };
                el.addEventListener('keydown', trap);
                el._trap = trap; el._trigger = trigger;
                return el;
            }

            function closeModal(trigger) {
                const el = _dom.modalContainer.lastElementChild;
                if (!el) return;
                const t = trigger || el._trigger || null;
                if (el._trap) el.removeEventListener('keydown', el._trap);
                if (el._onClose) { el._onClose(); el._onClose = null; }
                el.classList.add('opacity-0');
                el.querySelector('.transform').classList.add('scale-95');
                el.addEventListener('transitionend', ()=>{ el.remove(); if(t&&t.focus) t.focus(); }, {once:true});
            }

            // ── Shared per-employee stats (email / report / banner) ────────
            function buildStats(year, month) {
                const sections   = STATE_STORE.get('sections');
                const employees  = STATE_STORE.get('employees');
                const activities = STATE_STORE.get('activities');
                return employees.map(emp => {
                    const acts = activities.filter(a => a.employeeId===emp.id && a.year===year);
                    const mCnt = acts.filter(a => a.month===month).reduce((s,a)=>s+a.count,0);
                    const ytd  = acts.reduce((s,a)=>s+a.count,0);
                    return { emp, mCnt, ytd, sec: sections.find(s => s.id===emp.sectionId) };
                });
            }

            // ── Email Summary Generator ────────────────────────────────────
            function generateEmailSummary(year, month) {
                const sections  = STATE_STORE.get('sections');
                const employees = STATE_STORE.get('employees');
                const mName = APP_CONFIG.fullMonthNames[month - 1];
                const line  = s => s + '\n';
                const sep   = () => '─'.repeat(40) + '\n';

                const stats = buildStats(year, month);

                const gTgt       = STATE_STORE.get('globalTarget') || 12;
                const totalMonth = stats.reduce((s,e)=>s+e.mCnt,0);
                const submitted  = stats.filter(e=>e.mCnt>0).length;
                const onTarget   = stats.filter(e=>e.ytd>=gTgt).length;

                let body = '';
                body += line(`เรื่อง: สรุปผลกิจกรรม Kaizen เดือน${mName} ปี ${year}`);
                body += line('');
                body += line('เรียน ทุกท่าน');
                body += line('');
                body += line(`ขอสรุปผลกิจกรรม Kaizen ประจำเดือน${mName} ปี ${year} ดังนี้`);
                body += line('');
                body += sep();
                body += line('ภาพรวมประจำเดือน');
                body += sep();
                body += line(`ยอดรวมทั้งหมด         : ${totalMonth} เรื่อง`);
                body += line(`พนักงานที่ส่งกิจกรรม  : ${submitted} / ${employees.length} คน`);
                body += line(`พนักงานถึงเป้า (รายปี): ${onTarget} / ${employees.length} คน`);
                body += line('');

                sections.forEach(sec => {
                    const secStats = stats.filter(e => e.emp.sectionId===sec.id);
                    const secTotal = secStats.reduce((s,e)=>s+e.mCnt,0);
                    body += sep();
                    body += line(`แผนก ${sec.name}  —  เดือนนี้รวม ${secTotal} เรื่อง`);
                    body += sep();
                    body += line(`${'ชื่อ'.padEnd(30)} ${'เดือนนี้'.padStart(6)}  ${'รวมปีนี้'.padStart(6)}  ${'เป้าหมาย'.padStart(6)}  %`);
                    body += line('·'.repeat(60));
                    [...secStats].sort((a,b)=>b.mCnt-a.mCnt).forEach(e => {
                        const name = `${e.emp.firstName} ${e.emp.lastName}`.slice(0,28).padEnd(30);
                        const pct  = gTgt>0 ? Math.round((e.ytd/gTgt)*100) : 0;
                        const bar  = e.ytd>=gTgt ? '✓' : `${pct}%`;
                        body += line(`${name} ${String(e.mCnt).padStart(6)}  ${String(e.ytd).padStart(6)}  ${String(gTgt).padStart(6)}  ${bar}`);
                    });
                    body += line('');
                });

                const topMonth = [...stats].sort((a,b)=>b.mCnt-a.mCnt).filter(e=>e.mCnt>0);
                if (topMonth.length) {
                    body += sep();
                    body += line(`ผู้มีผลงานสูงสุด เดือน${mName}`);
                    body += sep();
                    const medals = ['🥇','🥈','🥉'];
                    let rank=0, prev=-1;
                    topMonth.forEach(e => {
                        if (e.mCnt!==prev) { rank++; prev=e.mCnt; }
                        if (rank<=3) body += line(`${medals[rank-1]} ${e.emp.firstName} ${e.emp.lastName}: ${e.mCnt} เรื่อง`);
                    });
                    body += line('');
                }

                body += line('─'.repeat(40));
                body += line('จัดทำโดย: ระบบ Kaizen Activity Tracker');
                return body;
            }

            // ── HTML Email Generator ───────────────────────────────────────
            function generateEmailHtml(year, month) {
                const sections  = STATE_STORE.get('sections');
                const employees = STATE_STORE.get('employees');
                const mName = APP_CONFIG.fullMonthNames[month - 1];
                const esc   = s => escHtml(String(s ?? ''));

                const stats = buildStats(year, month);

                const gTgt       = STATE_STORE.get('globalTarget') || 12;
                const totalMonth = stats.reduce((s,e)=>s+e.mCnt,0);
                const submitted  = stats.filter(e=>e.mCnt>0).length;
                const onTarget   = stats.filter(e=>e.ytd>=gTgt).length;

                const topMonth = [...stats].sort((a,b)=>b.mCnt-a.mCnt).filter(e=>e.mCnt>0);
                const medals   = ['🥇','🥈','🥉'];
                let topRows='', rank=0, prev=-1;
                topMonth.forEach(e => {
                    if (e.mCnt!==prev){rank++;prev=e.mCnt;}
                    if (rank<=3) topRows+=`<tr style="border-bottom:1px solid #fef3c7;">
                        <td style="padding:12px 16px;font-size:22px;width:40px;">${medals[rank-1]}</td>

                    </tr>`;
                });

                let sectionsHtml = '';
                sections.forEach(sec => {
                    const secStats = stats.filter(e=>e.emp.sectionId===sec.id);
                    const secTotal = secStats.reduce((s,e)=>s+e.mCnt,0);
                    const rows = [...secStats].sort((a,b)=>b.ytd-a.ytd||b.mCnt-a.mCnt).map((e, idx) => {

                        const rowBg = e.mCnt===0?'#f9fafb':ok?'#f0fdf4':'#ffffff';
                        return `<tr style="background:${rowBg};border-bottom:1px solid #f3f4f6;">
                            <td style="padding:9px 12px;font-size:13px;color:${e.mCnt===0?'#9ca3af':'#111827'};font-weight:${e.mCnt>0?600:400};">${esc(e.emp.firstName)} ${esc(e.emp.lastName)}</td>
                            <td style="padding:9px 8px;text-align:center;font-size:15px;font-weight:bold;color:#2563eb;">${e.mCnt}</td>
                            <td style="padding:9px 8px;text-align:center;font-size:13px;color:#374151;">${e.ytd}</td>
                            <td style="padding:9px 8px;text-align:center;font-size:13px;color:#6b7280;">${gTgt}</td>
                            <td style="padding:9px 12px;white-space:nowrap;">
                                <table cellpadding="0" cellspacing="0" style="display:inline-table;vertical-align:middle;border-radius:4px;overflow:hidden;background:#e5e7eb;width:60px;">
                                    <tr><td style="width:${fillW}px;background:${clr};height:8px;"></td><td style="width:${60-fillW}px;height:8px;"></td></tr>
                                </table>
                                <span style="font-size:12px;color:${ok?'#16a34a':'#4b5563'};margin-left:6px;">${ok?'✓ ถึงเป้า':pct+'%'}</span>
                            </td>
                        </tr>`;
                    }).join('');
                    sectionsHtml += `
                    <tr><td height="16" style="line-height:16px;">&nbsp;</td></tr>
                    <tr>
                      <td style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                        <table width="100%" cellpadding="0" cellspacing="0">
                          <tr><td style="background:#7c3aed;padding:12px 16px;">
                            <span style="color:white;font-size:15px;font-weight:bold;">🏭 แผนก ${esc(sec.name)}</span>
                            <span style="color:rgba(255,255,255,0.8);font-size:13px;float:right;">รวมเดือนนี้: ${secTotal} เรื่อง</span>
                          </td></tr>
                          <tr><td>
                            <table width="100%" cellpadding="0" cellspacing="0">
                              <tr style="background:#f9fafb;border-bottom:1px solid #e5e7eb;">
                                <th style="padding:9px 12px;text-align:left;font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;">ชื่อ-สกุล</th>
                                <th style="padding:9px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600;">เดือนนี้</th>
                                <th style="padding:9px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600;">รวมปี</th>
                                <th style="padding:9px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600;">เป้าหมาย</th>
                                <th style="padding:9px 12px;font-size:11px;color:#6b7280;font-weight:600;">ความคืบหน้า</th>
                              </tr>
                              ${rows}
                            </table>
                          </td></tr>
                        </table>
                      </td>
                    </tr>`;
                });

                return `<!DOCTYPE html><html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>สรุป Kaizen ${esc(mName)} ${year}</title></head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f2f5;">

            // ── Podium SVG — YTD ranking, shared by report & banner ────────

                const topYtd    = [...stats].sort((a,b)=>b.ytd-a.ytd).filter(e=>e.ytd>0);
                if (topYtd.length === 0) return '';
                const topScores = [...new Set(topYtd.map(e=>e.ytd))].slice(0,3);
                const podiumData = topScores.map((score, idx) => {
                    const winners = stats.filter(e=>e.ytd===score);
                    return { rank: idx+1, score, ytd: score, winners };
                });
                const W=720, H=328, FL=318;
                const gName = d => !d ? '' : d.winners.length===1
                    ? `${esc(d.winners[0].emp.firstName)} ${esc(d.winners[0].emp.lastName)}`
                    : d.winners.map(w=>esc(w.emp.firstName)).join(', ');
                const gSec = d => !d ? '' : d.winners.length===1
                    ? esc(sections.find(s=>s.id===d.winners[0].emp.sectionId)?.name||'')
                    : 'หลายแผนก';
                // pods: [left=2nd, center=1st, right=3rd]
                const pods = [
                    { cx:175, pT:248, pW:148, pH:70,  rank:2, d:podiumData[1]||null },
                    { cx:360, pT:196, pW:162, pH:122, rank:1, d:podiumData[0]||null },
                    { cx:545, pT:265, pW:148, pH:53,  rank:3, d:podiumData[2]||null }
                ];
                const pC={
                    1:{f:'#fcd34d',d:'#f59e0b',t:'#fefce8',lbl:'🏆 อันดับ 1'},
                    2:{f:'#cbd5e1',d:'#94a3b8',t:'#f8fafc',lbl:'🥈 อันดับ 2'},
                    3:{f:'#fdba74',d:'#ea580c',t:'#fff7ed',lbl:'🥉 อันดับ 3'}
                };

                // Chibi character — bigger head, big eyes, spiky hair
                const per = (cx, sY, rank) => {
                    const hY = sY - 88;
                    const skin = '#FFD5A8';
                    const hair = '#3b2415';

                    let aura = '';
                    if (rank === 1) {

                    }

                    // Open hand, palm + 4 fanned fingers + thumb — no held props, just a raised bare hand.
                    // dirX = -1 for the left hand, 1 for the right hand (always attached consistently
                    // per side across all three ranks), used to fan the fingers and to point the thumb
                    // inward toward the body rather than outward.
                    const hand = (hx, hy, dirX) => {
                        dirX = dirX || 1;
                        const palm = `<ellipse cx="${hx}" cy="${hy}" rx="7.5" ry="8.5" fill="${skin}" stroke="#e8a070" stroke-width="1.2"/>`;

                        const fingerBaseX = i => hx + dirX*2.5 + (i-1.5)*4.6;
                        const fingerBaseY = i => hy - 6 - Math.abs(i-1.5)*0.8;
                        const fingerAngle = i => dirX*12 + (i-1.5)*15;
                        const fingerLen   = i => 10.5 - Math.abs(i-1.5)*1.3;
                        let fingers = '';
                        for (let i=0; i<4; i++) {
                            const len = fingerLen(i);
                            fingers += `<g transform="translate(${fingerBaseX(i)},${fingerBaseY(i)}) rotate(${fingerAngle(i)})">` +
                                `<rect x="-1.7" y="${-len}" width="3.4" height="${len}" rx="1.7" fill="${skin}" stroke="#e8a070" stroke-width="0.8"/>` +
                                `</g>`;
                        }

                        const thumbAngle = -dirX*112;
                        const thumbX = hx - dirX*3.5, thumbY = hy + 1.5;
                        const thumb = `<g transform="translate(${thumbX},${thumbY}) rotate(${thumbAngle})">` +
                            `<rect x="-2" y="-7.5" width="4" height="7.5" rx="2" fill="${skin}" stroke="#e8a070" stroke-width="0.8"/>` +

                        return palm + fingers + thumb;
                    };

                    let arms = '';

                               hand(cx-44, sY-104, -1) + hand(cx+50, sY-108, 1);

                    }

                    const body =
                        // main torso
                        `<rect x="${cx-19}" y="${sY-70}" width="38" height="44" rx="12" fill="#7dd3fc"/>` +

                        // center zip
                        `<rect x="${cx-2.5}" y="${sY-61}" width="5" height="35" fill="#0ea5e9" opacity="0.5"/>` +
                        // reflective safety stripes (chest + waist)
                        `<rect x="${cx-19}" y="${sY-46}" width="38" height="4.5" fill="#f1f5f9" opacity="0.9"/>` +
                        `<rect x="${cx-19}" y="${sY-30}" width="38" height="3.5" fill="#f1f5f9" opacity="0.8"/>` +
                        // chest pocket with flap + button
                        `<rect x="${cx-16}" y="${sY-57}" width="11" height="9" rx="1.5" fill="#38bdf8" stroke="#0369a1" stroke-width="1"/>` +

                        `<rect x="${cx-13}" y="${sY-28}" width="11" height="28" rx="5" fill="#0369a1"/>` +

                        `<rect x="${cx+2}" y="${sY-11}" width="11" height="3" fill="#f1f5f9" opacity="0.85"/>` +
                        // safety shoes: dark shell + sole + steel-toe cap highlight
                        `<ellipse cx="${cx-8}" cy="${sY}" rx="12" ry="6" fill="#1e293b"/>` +
                        `<ellipse cx="${cx+8}" cy="${sY}" rx="12" ry="6" fill="#1e293b"/>` +
                        `<ellipse cx="${cx-11}" cy="${sY-2.5}" rx="5.5" ry="3.5" fill="#475569"/>` +
                        `<ellipse cx="${cx+11}" cy="${sY-2.5}" rx="5.5" ry="3.5" fill="#475569"/>` +
                        `<rect x="${cx-19}" y="${sY+2.5}" width="20" height="3.5" rx="1.5" fill="#0f172a"/>` +
                        `<rect x="${cx-1}" y="${sY+2.5}" width="20" height="3.5" rx="1.5" fill="#0f172a"/>`;

                    let medal = '';
                    if (rank === 2) {
                        medal =
                            `<rect x="${cx-3}" y="${sY-70}" width="6" height="20" rx="2" fill="#93c5fd" opacity="0.9"/>` +
                            `<circle cx="${cx}" cy="${sY-50}" r="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>` +
                            `<circle cx="${cx}" cy="${sY-50}" r="9" fill="#e8ecf0"/>` +

                    } else if (rank === 3) {
                        medal =
                            `<rect x="${cx-3}" y="${sY-70}" width="6" height="20" rx="2" fill="#fb923c" opacity="0.9"/>` +

                            `<circle cx="${cx}" cy="${sY-50}" r="9" fill="#fde68a"/>` +

                    }

                    const head = `<circle cx="${cx}" cy="${hY}" r="28" fill="${skin}" stroke="#e8a070" stroke-width="1.5"/>`;

                    // Hard hat — same style/color for every rank (real PPE, not a costume)
                    const hatBrimY = hY - 24;
                    const hardHat =
                        `<path d="M ${cx-26},${hatBrimY} Q ${cx-28},${hatBrimY-22} ${cx},${hatBrimY-26} Q ${cx+28},${hatBrimY-22} ${cx+26},${hatBrimY} Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>` +

                    let face = '';

                            `<path d="M ${cx-20},${hY-5} Q ${cx-11},${hY+5} ${cx-2},${hY-5}" fill="none" stroke="#1c0800" stroke-width="2.5" stroke-linecap="round"/>` +
                            `<path d="M ${cx+2},${hY-5} Q ${cx+11},${hY+5} ${cx+20},${hY-5}" fill="none" stroke="#1c0800" stroke-width="2.5" stroke-linecap="round"/>` +
                            `<path d="M ${cx-20},${hY-18} Q ${cx-11},${hY-27} ${cx-2},${hY-18}" fill="none" stroke="${hair}" stroke-width="2.5" stroke-linecap="round"/>` +
                            `<path d="M ${cx+2},${hY-18} Q ${cx+11},${hY-27} ${cx+20},${hY-18}" fill="none" stroke="${hair}" stroke-width="2.5" stroke-linecap="round"/>` +
                            `<path d="M ${cx-13},${hY+10} Q ${cx},${hY+24} ${cx+13},${hY+10}" fill="#d97060" stroke="#b85030" stroke-width="1" stroke-linecap="round"/>` +
                            `<path d="M ${cx-13},${hY+10} Q ${cx},${hY+19} ${cx+13},${hY+10}" fill="#ffb090" stroke="none"/>` +
                            `<circle cx="${cx-21}" cy="${hY+9}" r="9" fill="#FF9DB3" opacity="0.52"/>` +

                            `<path d="M ${cx-19},${hY-18} Q ${cx-11},${hY-25} ${cx-3},${hY-18}" fill="none" stroke="${hair}" stroke-width="2.5" stroke-linecap="round"/>` +

                            `<path d="M ${cx-2},${hY+5} Q ${cx},${hY+8} ${cx+2},${hY+5}" fill="none" stroke="#c07840" stroke-width="1.5" stroke-linecap="round"/>` +

                            `<circle cx="${cx-19}" cy="${hY+11}" r="7" fill="#FF9DB3" opacity="0.5"/>` +

                    }

                    let stars = '';
                    if (rank === 1) {

                    // Safety goggles worn over the eyes (not pushed up) — drawn after the face so the

                    const gY = rank === 1 ? hY-5 : hY-4;

                           `<rect x="${cx-72}" y="${ny}" width="144" height="30" rx="${isChamp ? 10 : 8}" fill="rgba(255,255,255,0.96)" stroke="${isChamp ? '#f59e0b' : 'none'}" stroke-width="${isChamp ? 1.5 : 0}"/>` +

            // ── Monthly trend bar chart — shared by report & banner ─────────
            function makeMonthlyBarChartSvg(activities, year, month) {
                const yearActs = activities.filter(a => a.year === year);
                if (yearActs.length === 0) return '';
                const totals = Array(12).fill(0);
                yearActs.forEach(a => { if (a.month >= 1 && a.month <= 12) totals[a.month - 1] += a.count; });

                const W = 720, H = 160;
                const padL = 34, padR = 16, padT = 18, padB = 24;
                const chartW = W - padL - padR, chartH = H - padT - padB;
                const maxVal = Math.max(1, ...totals);
                const barGap = 8;
                const barW = (chartW - barGap * 11) / 12;

                const gridLines = [0, 0.5, 1].map(f => {
                    const y = padT + chartH * (1 - f);
                    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
                }).join('');

                const bars = totals.map((v, i) => {
                    const x = padL + i * (barW + barGap);
                    const h = maxVal > 0 ? Math.round((v / maxVal) * chartH) : 0;
                    const y = padT + chartH - h;
                    const isCurrent = (i + 1) === month;
                    const fill = isCurrent ? '#2563eb' : 'rgba(59,130,246,0.45)';
                    const valueLbl = v > 0 ? `<text x="${x + barW/2}" y="${y - 5}" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" font-family="Arial,sans-serif">${v}</text>` : '';
                    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,1)}" rx="3" fill="${fill}"/>${valueLbl}` +
                        `<text x="${x + barW/2}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial,sans-serif">${escHtml(APP_CONFIG.monthNames[i])}</text>`;
                }).join('');

                return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">` +
                    `<rect width="${W}" height="${H}" fill="#ffffff" rx="8"/>` +
                    gridLines + bars +
                    `</svg>`;
            }

            // ── OCR Import via Gemini Vision ───────────────────────────────
            function handleOcrImportClick() {
                const trigger  = _domCache.ocrImportBtn;
                const currentYear = STATE_STORE.get('currentYear');
                const currentMonth = STATE_STORE.get('currentMonth');

                let yo=''; for(let i=currentYear+5;i>=currentYear-5;i--) yo+=`<option value="${i}">${i}</option>`;
                const mo = APP_CONFIG.fullMonthNames.map((n,i)=>`<option value="${i+1}">${escHtml(n)}</option>`).join('');

                const modal = UI_RENDERER.showModal({
                    title: '<i data-lucide="camera" class="mr-2 inline-block" aria-hidden="true"></i> อ่านข้อมูลจากภาพ (Gemini AI)',
                    body: `
                    <div class="space-y-4">
                        <div>
                            <label for="ocr-key" class="block text-sm font-medium text-gray-700 mb-1">Google Gemini API Key</label>
                            <div class="flex gap-2">
                                <input type="password" id="ocr-key" value="" class="w-full p-2 border rounded-md font-mono text-sm" placeholder="AIza...">
                                <button id="ocr-save-key" class="text-xs bg-gray-100 border px-3 rounded hover:bg-gray-200 whitespace-nowrap">บันทึก</button>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">คีย์จะถูกเข้ารหัส (AES-GCM) แล้วเก็บไว้ในเบราว์เซอร์เครื่องนี้ — หลีกเลี่ยงการบันทึกบนเครื่องสาธารณะ</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label for="ocr-year" class="block text-sm font-medium text-gray-700 mb-1">ปี</label><select id="ocr-year" class="w-full p-2 border rounded-md">${yo}</select></div>
                            <div><label for="ocr-month" class="block text-sm font-medium text-gray-700 mb-1">เดือน</label><select id="ocr-month" class="w-full p-2 border rounded-md">${mo}</select></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">แนบภาพ Screenshot</label>
                            <div id="ocr-drop" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-teal-400 hover:bg-teal-50 transition">
                                <i data-lucide="cloud-upload" class="text-4xl text-gray-300 mb-2 inline-block" style="width:2.5rem;height:2.5rem;" aria-hidden="true"></i>
                                <p class="text-gray-500 text-sm font-medium">คลิกหรือลากภาพมาวาง</p>
                                <p class="text-gray-400 text-xs mt-1">หรือกด <kbd class="bg-gray-100 px-1 rounded">Ctrl+V</kbd> วางจาก Clipboard</p>
                            </div>
                            <input type="file" id="ocr-file" accept="image/*" class="hidden">
                            <div id="ocr-prev" class="mt-2 hidden text-center">
                                <img id="ocr-prev-img" class="max-h-28 rounded border mx-auto" alt="preview">
                                <p class="text-xs text-green-600 mt-1"><i data-lucide="circle-check" class="inline-block" style="width:0.9rem;height:0.9rem;" aria-hidden="true"></i> ภาพพร้อมวิเคราะห์</p>
                            </div>
                        </div>
                    </div>`,
                    actions: [
                        {id:'cancel',  text:'ยกเลิก',      classes:'bg-gray-200 text-gray-800 hover:bg-gray-300'},
                        {id:'analyze', text:'วิเคราะห์ภาพ', classes:'bg-teal-600 text-white hover:bg-teal-700'}
                    ]
                }, trigger);

                modal.querySelector('#ocr-year').value  = currentYear;
                modal.querySelector('#ocr-month').value = currentMonth;

                GEMINI_AI_BRIDGE.decryptApiKey().then(k => {
                    if (k) modal.querySelector('#ocr-key').value = k;
                }).catch(err => DEBUG_MODULE.log('error','AI',err));

                let imgB64=null, imgMime=null;
                const fileToB64 = f => new Promise((res,rej)=>{
                    const r=new FileReader();
                    r.onload=e=>{ const [,b64]=e.target.result.split(','); res({b64,mime:f.type||'image/png'}); };
                    r.onerror=rej; r.readAsDataURL(f);
                });
                const setPreview = (b64,mime) => {
                    imgB64=b64; imgMime=mime;
                    const prev=modal.querySelector('#ocr-prev'), img=modal.querySelector('#ocr-prev-img');
                    img.src=`data:${mime};base64,${b64}`; prev.classList.remove('hidden');
                    modal.querySelector('#ocr-drop').classList.add('hidden');
                };

                const drop = modal.querySelector('#ocr-drop');
                const fi   = modal.querySelector('#ocr-file');
                drop.addEventListener('click', ()=>fi.click());
                drop.addEventListener('dragover', e=>{e.preventDefault(); drop.classList.add('border-teal-400','bg-teal-50');});
                drop.addEventListener('dragleave', ()=>drop.classList.remove('border-teal-400','bg-teal-50'));
                drop.addEventListener('drop', async e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')){const{b64,mime}=await fileToB64(f); setPreview(b64,mime);} });
                fi.addEventListener('change', async e=>{ const f=e.target.files[0]; if(f){const{b64,mime}=await fileToB64(f); setPreview(b64,mime);} });

                const onPaste = async e => {
                    if (!document.getElementById(modal.id)?.contains(document.activeElement) && document.activeElement!==document.body) return;
                    for (const item of (e.clipboardData?.items||[])) {
                        if (item.type.startsWith('image/')) { const{b64,mime}=await fileToB64(item.getAsFile()); setPreview(b64,mime); break; }
                    }
                };
                document.addEventListener('paste', onPaste);
                modal._onClose = () => document.removeEventListener('paste', onPaste);

                modal.querySelector('#ocr-save-key').addEventListener('click', async ()=>{
                    const k=modal.querySelector('#ocr-key').value.trim();
                    if(k){
                        try { await GEMINI_AI_BRIDGE.encryptAndStoreApiKey(k); UI_RENDERER.showNotification('บันทึก API Key แล้ว (เข้ารหัสไว้)','success'); }
                        catch(err) { DEBUG_MODULE.log('error','STORAGE',err); UI_RENDERER.showNotification('บันทึก API Key ไม่สำเร็จ','error'); }
                    }
                });

                modal.addEventListener('click', async e => {
                    const a = e.target.dataset.action;
                    if (a==='cancel'||e.target.classList.contains('modal-close-btn')) {
                        UI_RENDERER.closeModal(trigger); return;
                    }
                    if (a==='analyze') {
                        const key   = modal.querySelector('#ocr-key').value.trim();
                        const year  = parseInt(modal.querySelector('#ocr-year').value,10);
                        const month = parseInt(modal.querySelector('#ocr-month').value,10);
                        if (!key)   { UI_RENDERER.showNotification('กรุณาใส่ Gemini API Key','error'); return; }
                        if (!imgB64){ UI_RENDERER.showNotification('กรุณาแนบภาพก่อน','error'); return; }
                        const btn = e.target;
                        btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="mr-2 inline-block animate-spin" aria-hidden="true"></i>กำลังวิเคราะห์...';
                        if (window.lucide) lucide.createIcons();
                        btn.classList.add('opacity-75','cursor-not-allowed');
                        try {
                            const extracted = await GEMINI_AI_BRIDGE.analyzeImageWithGemini(key, imgB64, imgMime);
                            UI_RENDERER.closeModal(trigger);
                            showOcrReviewModal(extracted, year, month, trigger);
                        } catch(err) {
                            UI_RENDERER.showNotification(`วิเคราะห์ไม่สำเร็จ: ${err.message}`,'error');
                            btn.disabled=false; btn.innerHTML='วิเคราะห์ภาพ';
                            btn.classList.remove('opacity-75','cursor-not-allowed');
                        }
                    }
                });
            }

            function showOcrReviewModal(extracted, year, month, originalTrigger) {
                const mName = APP_CONFIG.fullMonthNames[month-1];
                const rows  = extracted.map(item => ({
                    src:      item.name,
                    count:    typeof item.count==='number' ? item.count : parseInt(item.count,10)||0,
                    employee: GEMINI_AI_BRIDGE.matchEmployeeByName(item.name)

                const rowsHtml = rows.map((r,i)=>`

                    body: `
                    <div class="flex flex-wrap gap-2 mb-3">
                        <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold">✓ จับคู่ได้ ${matched} คน</span>
                        ${unmatched>0?`<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-semibold">⚠ ไม่พบ ${unmatched} คน (ข้ามไป)</span>`:''}

                    <div class="overflow-y-auto max-h-72 border rounded-lg">
                        <table class="w-full text-sm">

                                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600">ชื่อจากภาพ</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600">จับคู่กับ</th>
                                    <th class="px-3 py-2 text-center text-xs font-semibold text-gray-600">Count</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                    <p class="text-xs text-gray-400 mt-2">* แก้ไขตัวเลขได้ก่อนกดบันทึก</p>`,

                        {id:'cancel', text:'ยกเลิก',      classes:'bg-gray-200 text-gray-800 hover:bg-gray-300'},
                        {id:'save',   text:'บันทึกทั้งหมด', classes:'bg-teal-600 text-white hover:bg-teal-700'}
                    ]
                }, originalTrigger);

                modal.addEventListener('click', async e => {
                    const a = e.target.dataset.action;
                    if (a==='cancel'||e.target.classList.contains('modal-close-btn')) {
                        UI_RENDERER.closeModal(originalTrigger); return;
                    }
                    if (a==='save') {
                        const activities = [...STATE_STORE.get('activities')];
                        let saved=0;
                        modal.querySelectorAll('.ocr-cnt:not([disabled])').forEach(inp => {
                            const row = rows[parseInt(inp.dataset.idx,10)];
                            if (!row?.employee) return;
                            const cnt = parseInt(inp.value,10);
                            if (isNaN(cnt)||cnt<0) return;
                            const eid = row.employee.id;
                            const idx = activities.findIndex(x=>x.employeeId===eid&&x.year===year&&x.month===month);
                            if (idx>=0) activities[idx] = {...activities[idx], count:cnt};
                            else activities.push({employeeId:eid,year,month,count:cnt});
                            saved++;
                        });
                        try {
                            await STATE_STORE.optimisticUpdate('activities', activities, STORAGE_ENGINE.saveActivities);
                            UI_RENDERER.showNotification(`บันทึกข้อมูล ${saved} คนสำเร็จ!`,'success');
                        } catch(err) {}
                        UI_RENDERER.closeModal(originalTrigger);
                    }
                });
            }

            // ── Email Banner: capture → clipboard → download fallback ──────
            function _getBannerCaptureEl() {
                if (!_bannerCaptureEl) {
                    _bannerCaptureEl = document.createElement('div');
                    _bannerCaptureEl.id = 'eb-capture-root';
                    _bannerCaptureEl.style.cssText = 'position:fixed;left:-9999px;top:0;z-index:-1;pointer-events:none;';
                    document.body.appendChild(_bannerCaptureEl);
                }
                return _bannerCaptureEl;
            }

            async function _waitForBannerFonts() {
                if (document.fonts && document.fonts.ready) {
                    await Promise.race([ document.fonts.ready, new Promise(res => setTimeout(res, 3000)) ]);
                    await new Promise(res => setTimeout(res, 100));
                } else {
                    await new Promise(res => setTimeout(res, 800));
                }
            }

            async function _captureBannerBlob(year, month, title, author) {
                const root = _getBannerCaptureEl();
                root.innerHTML = UI_RENDERER.generateEmailBannerContent(year, month, title, author);
                const node = root.firstElementChild;
                await _waitForBannerFonts();
                return await htmlToImage.toBlob(node, {
                    pixelRatio: 2,
                    backgroundColor: '#ffffff',
                    cacheBust: true,
                });
            }

            async function handleCopyBannerImage(year, month, title, author) {
                let blob;
                try {
                    blob = await _captureBannerBlob(year, month, title, author);
                    if (!blob) throw new Error('toBlob returned null');
                } catch (err) {
                    DEBUG_MODULE.log('error', 'EMAIL_BANNER_CAPTURE', err);
                    UI_RENDERER.showNotification('สร้างรูปภาพไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error');
                    return;
                }

                const filename = `Kaizen_Email_Banner_${year}_${String(month).padStart(2,'0')}.png`;
                try {
                    if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === 'undefined') {
                        throw new Error('Clipboard image write API not supported in this browser/context');
                    }
                    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
                    UI_RENDERER.showNotification('คัดลอกรูปภาพแล้ว! ไปที่อีเมลแล้วกด Ctrl+V เพื่อวางได้เลย', 'success');
                } catch (err) {
                    DEBUG_MODULE.log('error', 'EMAIL_BANNER_CLIPBOARD', err);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    UI_RENDERER.showNotification('ไม่สามารถคัดลอกรูปภาพอัตโนมัติได้ ระบบดาวน์โหลดไฟล์ PNG ให้แทน กรุณาแนบไฟล์ในอีเมลด้วยตนเอง', 'info');
                }
            }

            return { init };
        })();

        APP_CORE.init();
    });
